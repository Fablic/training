ja:
  activerecord:
    models:
      task: タスク
      search_form: タスク検索

    # モデルごとに設定する
    attributes:
      task:
        id: ID
        name: タスク名
        description: 詳細
        user_id: 担当者
        due_date: 終了期限
        status: 状態
      task/status:
        status_new: 未着手
        status_progoress: 着手中
        status_complete: 完了

  # 全てのmodelで共通
  attributes:
    created_at: 作成日
    updated_at: 更新日

  messages:
    create:
      notice: タスクを登録しました。
      alert: タスク登録できません。
    update:
      notice: タスクを更新しました。
      alert: タスクが更新できません。
    destroy:
      notice: タスクを削除しました。
      alert: タスク削除できません。
  # enum
  enums:
    task:
      status:
        new: 未着手
        progress: 着手中
        complete: 完了

  # activerecordではなく、activemodelとして定義する
  activemodel:
    models:
      search_form: タスク検索
    attributes:
      search_form:
        name: タスク名
        status: 状態
