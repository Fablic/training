---
ja:
  date:
    formats:
      default: "%Y/%m/%d %H:%M:%S"
      long: "%Y年%m月%d日(%a)"
      short: "%m/%d"
  errors:
    format: "%{attribute}%{message}"
    messages:
      empty: を入力してください
      invalid: は不正な値です
      model_invalid: 'バリデーションに失敗しました: %{errors}'
      required: を入力してください
      taken: はすでに存在します
      too_long: は%{count}文字以内で入力してください
    template:
      body: 次の項目を確認してください
      header:
        one: "%{model}にエラーが発生しました"
        other: "%{model}に%{count}個のエラーが発生しました"
  time:
    am: 午前
    formats:
      default: "%Y/%m/%d %H:%M:%S"
      long: "%Y/%m/%d %H:%M"
      short: "%m/%d %H:%M"
    pm: 午後
