# Files in the config/locales directory are used for internationalization
# and are automatically loaded by Rails. If you want to use locales other
# than English, add the necessary files in this directory.
#
# To use the locales, use `I18n.t`:
#
#     I18n.t 'hello'
#
# In views, this is aliased to just `t`:
#
#     <%= t('hello') %>
#
# To use a different locale, set it with `I18n.locale`:
#
#     I18n.locale = :es
#
# This would use the information in config/locales/es.yml.
#
# The following keys must be escaped otherwise they will not be retrieved by
# the default I18n backend:
#
# true, false, on, off, yes, no
#
# Instead, surround them with single quotes.
#
# en:
#   'true': 'foo'
#
# To learn more, please read the Rails Internationalization guide
# available at https://guides.rubyonrails.org/i18n.html.

en:
  views:
    pagination:
      first: "&laquo;"
      last: "&raquo;"
      previous: "&lsaquo;"
      next: "&rsaquo;"
      truncate: "..."
  enums:
    task:
      status:
        todo: todo
        doing: doing
        done: done
      priority:
        low: low
        medium: medium
        high: high
    user:
      role:
        admin: admin
        normal: normal
  models:
    task: task
    user: user
  attributes:
    model:
      task:
        name: Task name
        description: Description
        status: Status
        priority: Priority
        expired_date: Expired date
      user:
        name: User name
        description: Description
        password: Password
        role: Role
  err_msgs:
    too_long: The length should less than 255 characters
  flash_msgs:
    task:
      create_ok: Task was successfully created.
      update_ok: Task was successfully updated.
      delete_ok: Task was successfully destroyed.
    user:
      create_ok: User was successfully created.
      update_ok: User was successfully updated.
      delete_ok: User was successfully destroyed.
      at_least_one_admin: At least 1 admin user should be remained!
    login_failed: Login failed. Please input correct user name & password.
    no_login: Please login first!
  pages:
    navbar:
      admin: Admin
      tasks: Tasks
      logout: Log out
    task_list_page:
      title: Tasks
      new_task: New task
      edit_task: Edit
      delete_task: Delete
    create_tasks_page:
      title: New task
    edit_tasks_page:
      title: Edit task
    task_detail_page:
      title: Task details
    login_page:
      title: Login
    user_list_page:
      title: Users
      new_user: New user
      edit_user: Edit
      delete_user: Delete
    create_users_page:
      title: New user
    edit_users_page:
      title: Edit user
    user_detail_page:
      title: User details
  task_back: Back to tasks
  user_back: Back to users
  date:
    order: [ "day", "month", "year" ]
