# Files in the config/locales directory are used for internationalization and
# are automatically loaded by Rails. If you want to use locales other than
# English, add the necessary files in this directory.
#
# To use the locales, use `I18n.t`:
#
#     I18n.t "hello"
#
# In views, this is aliased to just `t`:
#
#     <%= t("hello") %>
#
# To use a different locale, set it with `I18n.locale`:
#
#     I18n.locale = :es
#
# This would use the information in config/locales/es.yml.
#
# To learn more about the API, please read the Rails Internationalization guide
# at https://guides.rubyonrails.org/i18n.html.
#
# Be aware that YAML interprets the following case-insensitive strings as
# booleans: `true`, `false`, `on`, `off`, `yes`, `no`. Therefore, these strings
# must be quoted to be interpreted as strings. For example:
#
#     en:
#       "yes": yup
#       enabled: "ON"

en:
  name: 'Name'
  description: 'Description'
  deadline: 'Deadline'
  created_at: 'Created'
  priority: 'Priority'
  status: 'Status'
  labels: 'Labels'
  msg_create_success: 'Task was successfully created.'
  msg_create_failure: 'Failed to create a task.'
  msg_update_success: 'Task was successfully updated.'
  msg_update_failure: 'Failed to update a task.'
  msg_delete_success: 'Task was successfully deleted.'
  msg_delete_failure: 'Failed to delete a task.'
  activerecord:
    attributes:
      task:
        name: 'Name'
        description: 'Description'
        deadline: 'Deadline'
        created_at: 'Created'
        priority: 'Priority'
        priorities:
          low: "Low"
          medium: "Medium"
          high: "High"
        status: 'Status'
        statuses:
          to_do: "To Do"
          in_progress: "In Progress"
          done: "Done"
        labels: 'Labels'
  errors:
    format: "%{attribute} %{message}"
    messages:
      blank: "can't be blank"
      deadline_in_past: "can't be in the past"
      too_long: "is too long (maximum is 256 characters)"
  button:
    new_task: "New Task"
    update_task: "Update Task"
    back: "Back"
    save: "Save"
  page:
    task: "Task"
    task_detail: "Task Detail"
    edit_task: "Edit Task"
    create_new_task: "Create New Task"
    error_page:
      bad_request: "Bad Request."
      not_found: "Not Found."
      not_acceptable: "Not Acceptable."
      unprocessable_entity: "Unprocessable Entity."
      internal_server_error: "Internal Server Error."
      else: "An unexpected error occurred."
