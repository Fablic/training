<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>サーバーエラー</title>
  <style>
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      color: #333;
      text-align: center;
      background-color: #f8f9fa;
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    h1 {
      color: #dc3545; 
      font-size: 48px;
      margin-bottom: 10px;
    }
    p {
      font-size: 20px;
      color: #666;
      margin-bottom: 20px;
    }
    a {
      color: #007bff;
      text-decoration: none;
      font-size: 18px;
      border: 2px solid #007bff;
      padding: 10px 20px;
      border-radius: 5px;
      transition: background-color 0.3s, color 0.3s;
    }
    a:hover {
      background-color: #007bff;
      color: white;
    }
    .container {
      width: 80%;
      max-width: 600px;
      padding: 40px;
      background-color: white;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>500 Internal Server Error</h1>
    <p>申し訳ありません、サーバー内部でエラーが発生しました。問題を解決しています。</p>
    <a href="/">ホームページに戻る</a>
  </div>
</body>
</html>
