<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ページが見つかりません</title>
  <style>
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      color: #333;
      text-align: center;
      padding-top: 50px;
      background-color: #f0f0f0;
      margin: 0;
      height: 100vh;
    }
    h1 {
      color: #2e2e2e;
      font-size: 48px;
    }
    p {
      font-size: 22px;
      color: #666;
    }
    a {
      color: #007BFF;
      text-decoration: none;
      font-size: 18px;
      border: 2px solid #007BFF;
      padding: 10px 20px;
      border-radius: 5px;
      transition: background-color 0.3s, color 0.3s;
    }
    a:hover {
      background-color: #007BFF;
      color: white;
    }
    .container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100%;
    }
    .logo {
      margin-bottom: 20px;
    }
    .logo img {
      width: 120px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <img src="/images/logo.jpg" alt="ロゴ">
    </div>
    <h1>404 Not Found</h1>
    <p>お探しのページは見つかりませんでした。</p>
    <a href="/">ホームに戻る</a>
  </div>
</body>
</html>
