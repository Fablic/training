# About rubocop configuration
# see: https://github.com/rubocop/rubocop/blob/master/config/default.yml

inherit_gem:
  fablicop:
    - "config/.base_rubocop.yml"

# ruby 3 以降から string はデフォルトで immutable になったので。
Style/FrozenStringLiteralComment:
  Enabled: false

# rails が自動生成したコードたちなので無視する
AllCops:
  Exclude:
    - "bin/*"
    - "db/schema.rb"

# 研修用の repogitory なので、アプリケーションが大きくならない想定なので、top-level documentation comment は不要そう
Documentation:
  Enabled: false

# block 名を明記しないのがデフォルトになったらしいが、明記したほうがわかりやすいと個人的に感じるので明記するように設定を上書き
# see: https://docs.rubocop.org/rubocop/cops_naming.html
Naming/BlockForwarding:
  EnforcedStyle: explicit

# hash の key と value の変数名が同じ場合、value の変数名を省略するのが default になったらしいが、慣れないので OFF にする。
# see: https://koic.hatenablog.com/entry/rubocop-supports-ruby-3-1-syntax
Style/HashSyntax:
  EnforcedShorthandSyntax: never

RSpec/NestedGroups:
  Max: 4

RSpec/MultipleExpectations:
  Max: 30
