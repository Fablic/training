inherit_from: .rubocop_todo.yml

require:
  - rubocop-performance
  - rubocop-rails

inherit_gem:
  fablicop:
    - "config/.base_rubocop.yml"

AllCops:
  Exclude:
    - "vendor/**/*"
    - "bin/**/*"
    - "db/**/*"
    - "tmp/**/*"
    - "node_modules/**/*"
    - "app/channels/**/*"
    - "config/environments/**"
    - "config/initializers/**"
    - "config/environment.rb"
    - "config/boot.rb"
    - "config/puma.rb"
    - "config/spring.rb"
