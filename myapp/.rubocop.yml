
require:
  - rubocop-rails

AllCops:
  NewCops: disable
  TargetRubyVersion: 2.6
  Exclude:
    - 'Gemfile'
    - 'config.ru'
    - 'bin/**'
    - 'lib/**'
    - 'node_modules/**/*'
    - 'db/**/*'
    - 'config/**/*'
    - 'script/**/*'
    - !ruby/regexp /old_and_unused\.rb$/

Style/ClassAndModuleChildren:
  Enabled: false

Style/Documentation:
  Enabled: false

Style/AsciiComments:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: false

Metrics/BlockLength:
  Exclude:
    - 'spec/**/*'

Metrics/AbcSize:
  Max: 20
