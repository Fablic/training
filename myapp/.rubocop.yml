require:
  - rubocop-performance
  - rubocop-rails

inherit_gem:
  fablicop:
    - "config/.base_rubocop.yml"

AllCops:
  Exclude:
    - "vendor/**/*"
    - "bin/**/*"
    - "db/**/*"
    - "tmp/**/*"
    - "node_modules/**/*"
    - "app/channels/**/*"
    - "app/controllers/application_controller.rb"
    - "app/helpers/application_helper.rb"
    - "app/models/application_record.rb"
    - "config/environments/**"
    - "config/initializers/**"
    - "config/environment.rb"
    - "config/boot.rb"
    - "config/puma.rb"
    - "config/spring.rb"
    - "config/application.rb"
    - "spec/rails_helper.rb"
    - "spec/spec_helper.rb"
    - "Rakefile"
    - "config.ru"

Style/SymbolArray:
  EnforcedStyle: brackets
