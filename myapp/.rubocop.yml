require: rubocop-rails

Style/Documentation:
  Enabled: false

AllCops:
  Exclude:
    - 'Rakefile'
    - 'app/channels/**/*'
    - 'app/helpers/application_helper.rb'
    - 'app/models/application_record.rb'
    - 'bin/**/*'
    - 'config.ru'
    - 'config/application.rb'
    - 'config/boot.rb'
    - 'config/environment.rb'
    - 'config/environments/**'
    - 'config/initializers/**'
    - 'config/puma.rb'
    - 'config/spring.rb'
    - 'db/**/*'
    - 'node_modules/**/*'
    - 'tmp/**/*'
    - 'vendor/**/*'
