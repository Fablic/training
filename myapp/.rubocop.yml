inherit_gem:
  fablicop:
    - "config/.base_rubocop.yml"

AllCops:
  Exclude:
    - "vendor/**/*"
    - "db/schema*.rb"
    - "node_modules/**/*"
    - "app/channels/**/*"
    - "config/**/*"
    - "config.ru"
    - "bin/**/*"
    - "public/**/*"
    - "tmp/**/*"
    - "log/**/*"

Style/FrozenStringLiteralComment:
  Enabled: false

# エラーカスタムページ用の記述を許容するため
Naming/VariableNumber:
  Exclude:
    - 'app/controllers/application_controller.rb'
Naming/MethodParameterName:
  Exclude:
    - 'app/controllers/application_controller.rb'

# Timezoneを設定しているためこの警告は不要
Rails/Date:
  Enabled: false

