name: CI

on: [ pull_request ]

jobs:
  myapp-test:
    runs-on: ubuntu-latest
    env:
      MYSQL_HOST: 127.0.0.1
      RAILS_ENV: test
    services:
      selenium:
        image: selenium/standalone-chrome:90.0
        ports:
          - 4444:4444
        volumes:
          - /dev/shm:/dev/shm
    defaults:
      run:
        working-directory: myapp
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v2
        with:
          node-version: '18'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2.2
          bundler-cache: true
          # NOTE: Currently, each action cannot honor `defaults.run.working-directory`.
          #       See https://github.com/ruby/setup-ruby/issues/54 for more details.
          working-directory: myapp
      - name: Setup Database
        run: |
          sudo apt-get install libmysqlclient-dev
          cp config/database.yml.ci config/database.yml
          sudo /etc/init.d/mysql start
          bundle exec rake db:create
          bundle exec rake db:migrate
      - run: yarn install
      - run: bundle exec rails webpacker:install
      - run: bundle exec rails db:create db:migrate
      - run: bundle exec rails assets:precompile
      - run: bundle exec rails webpacker:compile
      - run: bundle exec rspec
  rubocop:
    name: Rubocop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2.2
      - name: Install Fablicop
        run: gem install fablicop
        working-directory: myapp
      - name: Run Rubocop
        run: rubocop
        working-directory: myapp
