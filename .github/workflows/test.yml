name: rpec test & rubocop lint check
on: pull_request


jobs:
  rspec:
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: test
    steps:
      - uses: actions/checkout@v2

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2.2

      - name: Install dependent libralies
        run: sudo apt-get install libmysqlclient-dev
        working-directory: myapp

      - name: Setup bundler
        run: gem install bundler
        working-directory: myapp

      - name: bundle install
        run: |
          BUNDLER_VERSION=2.4.10 bundle install
          bundle install --jobs 4 --retry 3
        working-directory: myapp

      - name: Setup Database
        run: |
          cp config/database.yml.ci config/database.yml
          sudo /etc/init.d/mysql start
          bundle exec rake db:create
          bundle exec rake db:migrate
        working-directory: myapp
        env:
          RAILS_ENV: test

      - name: install webpacker
        run: |
          rm -rf bin/webpack*
          bundle exec rails webpacker:install
          bundle exec rails webpacker:compile
        working-directory: myapp

      - name: Run RSpec
        run: bundle exec rspec -f d
        working-directory: myapp
        env:
          RAILS_ENV: test
  rubocop:
    name: Rubocop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2.2
      - name: Install Fablicop
        run: gem install fablicop
        working-directory: myapp
      - name: Run Rubocop
        run: rubocop
        working-directory: myapp
